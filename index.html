* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at 50% 35%,
        #354553 0%,
        #151c23 42%,
        #06080b 100%);
}

.container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.title {
    position: absolute;
    top: 22px;
    font-size: 18px;
    letter-spacing: 4px;
    font-weight: bold;
}

.subtitle {
    position: absolute;
    top: 52px;
    font-size: 12px;
    opacity: .5;
}

/* Nova */

.nova {
    width: min(82vw, 460px);
    height: min(82vw, 460px);

    border-radius: 50%;

    position: relative;

    background:
        radial-gradient(
            ellipse at 50% 55%,
            #d9b4a0 0%,
            #c99782 42%,
            #7c5145 43%,
            #47352f 62%,
            #171b20 63%
        );

    box-shadow:
        0 25px 90px rgba(0,0,0,.7),
        0 0 90px rgba(150,200,240,.15);

    overflow: hidden;

    transition: .3s;
}

/* hair */

.nova:before {

    content: "";

    position: absolute;

    width: 70%;
    height: 55%;

    left: 15%;
    top: 3%;

    border-radius:
        50% 50% 30% 30%;

    background:
        linear-gradient(
            145deg,
            #3b2925,
            #6b493d 45%,
            #241c1b
        );

    box-shadow:
        inset 0 12px 20px rgba(255,255,255,.12);

}
