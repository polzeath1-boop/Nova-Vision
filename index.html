<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Vision</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(
            circle at 50% 38%,
            #354653 0%,
            #172129 42%,
            #070a0e 100%
        );
}

.container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
}

/* TITLE */

.title {
    position: absolute;
    top: 25px;
    font-size: 19px;
    letter-spacing: 5px;
    font-weight: bold;
}

.subtitle {
    position: absolute;
    top: 55px;
    font-size: 11px;
    letter-spacing: 2px;
    opacity: .55;
}

/* NOVA */

.nova {
    width: min(78vw, 390px);
    height: min(78vw, 390px);
    position: relative;
    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at 50% 58%,
            #e1bba8 0%,
            #c99581 45%,
            #754b41 46%,
            #43312d 64%,
            #171b20 65%
        );

    box-shadow:
        0 25px 90px rgba(0,0,0,.75),
        0 0 80px rgba(160,205,240,.15);

    overflow: hidden;

    transform: translateY(0);
    transition: .4s;
}

.nova.active {
    animation: breathe 4s ease-in-out infinite;
    box-shadow:
        0 25px 90px rgba(0,0,0,.75),
        0 0 100px rgba(150,210,255,.30);
}

@key
